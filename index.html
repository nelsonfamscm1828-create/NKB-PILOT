<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NKB PILOT</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f1f4f8;
  color: #172b4d;
}
header {
  background: #12345a;
  color: white;
  padding: 25px;
  text-align: center;
}
.container {
  padding: 20px;
}
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 6px #ccc;
}
.card h3 {
  color: #52657c;
}
.value {
  font-size: 25px;
  font-weight: bold;
}
</style>
</head>
<body>

<header>
<h1>NKB PILOT</h1>
<p>Business Management & Intelligence System</p>
</header>

<div class="container">
<h2>Business Dashboard</h2>

<div class="dashboard">
<div class="card"><h3>Total Sales</h3><div class="value">0 SSP</div></div>
<div class="card"><h3>Total Expenses</h3><div class="value">0 SSP</div></div>
<div class="card"><h3>Net Profit</h3><div class="value">0 SSP</div></div>
<div class="card"><h3>Cash Balance</h3><div class="value">0 SSP</div></div>
<div class="card"><h3>Number of Sales</h3><div class="value">0</div></div>
<div class="card"><h3>Number of Expenses</h3><div class="value">0</div></div>
<div class="card"><h3>Profit Margin</h3><div class="value">0%</div></div>
<div class="card"><h3>Products in Stock</h3><div class="value">0</div></div>
</div>
</div>

</body>
</html>
